  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==================================================
       1. CSS Variables & Global Styles
       ================================================== */
    :root {
      --bg-color: #f0f4f8;        
      --surface-color: #ffffff;   
      --border-color: #d9e2ec;    
      --text-main: #102a43;       
      --text-muted: #486581;      
      --accent-color: #005c97;    
      --accent-hover: #003e6b;    
      --accent-light: #e0f2fe;    
      
      --font-primary: 'Inter', system-ui, -apple-system, sans-serif;
      --font-serif: 'Merriweather', Georgia, serif; 
      
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
      --space-xl: 6rem;
      
      --radius-sm: 6px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(16, 42, 67, 0.05);
      --shadow-md: 0 4px 12px rgba(16, 42, 67, 0.08);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html { 
      scroll-behavior: smooth; 
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { 
      color: inherit; 
      text-decoration: none; 
      transition: color 0.2s; 
    }

    button { 
      background: none; 
      border: none; 
      color: inherit; 
      font: inherit; 
      cursor: pointer; 
    }

    img { 
      max-width: 100%; 
      height: auto; 
      display: block; 
    }

    :focus-visible { 
      outline: 2px solid var(--accent-color); 
      outline-offset: 4px; 
    }
    
    .hidden { 
      display: none !important; 
    }

    /* ==================================================
       2. Typography Hierarchy
       ================================================== */
    .title-display { 
      font-size: clamp(2.5rem, 5vw, 4.5rem); 
      font-weight: 900; 
      line-height: 1.1; 
      letter-spacing: -0.02em; 
      margin-bottom: var(--space-sm); 
      color: var(--text-main); 
    }

    .title-section { 
      font-size: clamp(1.75rem, 4vw, 2.5rem); 
      font-weight: 700; 
      letter-spacing: -0.01em; 
      margin-bottom: var(--space-lg); 
      color: var(--text-main); 
      border-bottom: 2px solid var(--accent-light); 
      padding-bottom: var(--space-xs); 
      display: inline-block; 
    }

    .title-item { 
      font-size: 1.25rem; 
      font-weight: 700; 
      margin-bottom: var(--space-xs); 
      color: var(--text-main); 
    }

    .text-lead { 
      font-size: clamp(1.125rem, 2vw, 1.35rem); 
      color: var(--text-muted); 
      line-height: 1.6; 
    }

    .text-body { 
      font-size: 1rem; 
      color: var(--text-muted); 
    }

    /* ==================================================
       3. Layout & Grid
       ================================================== */
    .container { 
      width: 100%; 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 0 var(--space-md); 
    }

    .section { 
      padding: var(--space-xl) 0; 
    }

    .section-surface { 
      background-color: var(--surface-color); 
      border-top: 1px solid var(--border-color); 
      border-bottom: 1px solid var(--border-color); 
    }

    .grid-12 { 
      display: grid; 
      grid-template-columns: repeat(12, 1fr); 
      gap: var(--space-md); 
    }

    /* ==================================================
       4. Headers & Footer
       ================================================== */
    .header-wrapper { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      z-index: 100; 
      background-color: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px); 
      box-shadow: var(--shadow-sm); 
    }

    .header-main { 
      height: 60px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border-color); 
    }

    .header-sub { 
      height: 44px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background-color: var(--bg-color); 
      border-bottom: 1px solid var(--border-color); 
      overflow-x: auto; 
    }
    
    .logo { 
      font-weight: 900; 
      font-size: 1.25rem; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      cursor: pointer;
    }

    .logo span { 
      color: var(--accent-color); 
    }
    
    .nav-links { 
      display: flex; 
      gap: var(--space-md); 
      padding: 0 var(--space-sm); 
      white-space: nowrap; 
    }

    .nav-link { 
      font-size: 0.875rem; 
      font-weight: 600; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      transition: color 0.2s ease; 
      cursor: pointer; 
    }

    .nav-link:hover { 
      color: var(--accent-color); 
    }
    
    .lang-switcher { 
      display: flex; 
      background: var(--bg-color); 
      border-radius: var(--radius-sm); 
      padding: 2px; 
      border: 1px solid var(--border-color); 
    }

    .lang-btn { 
      padding: 4px 12px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      color: var(--text-muted); 
      border-radius: 4px; 
      transition: all 0.2s ease; 
    }

    .lang-btn[aria-pressed="true"] { 
      background-color: var(--surface-color); 
      color: var(--accent-color); 
      box-shadow: var(--shadow-sm); 
    }

    .site-footer { 
      padding: var(--space-md) 0; 
      background-color: var(--text-main); 
      color: #fff; 
      text-align: center; 
      font-size: 0.875rem; 
    }

    .site-footer a { 
      color: #82caff; 
      font-weight: bold; 
      text-decoration: underline; 
      cursor: pointer; 
    }

    .site-footer a:hover { 
      color: #fff; 
    }

    /* ==================================================
       5. Landing Page Components
       ================================================== */
    .hero { 
      padding-top: calc(104px + var(--space-lg)); 
      padding-bottom: var(--space-lg); 
    }

    .hero-content { 
      grid-column: 1 / 7; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
    }

    .hero-visual { 
      grid-column: 7 / 13; 
    }

    .hero-poster { 
      width: 100%; 
      height: auto; 
      border-radius: var(--radius-md); 
      box-shadow: var(--shadow-md); 
      border: 1px solid var(--border-color); 
    }

    .disaster-lead { 
      grid-column: 1 / 8; 
      margin-bottom: var(--space-lg); 
    }

    .disaster-stats { 
      grid-column: 9 / 13; 
      border-left: 2px solid var(--accent-light); 
      padding-left: var(--space-md); 
      display: flex; 
      flex-direction: column; 
      gap: var(--space-md); 
    }

    .character-list { 
      display: flex; 
      flex-direction: column; 
    }

    .character-item { 
      display: grid; 
      grid-template-columns: 1fr 2.5fr; 
      gap: var(--space-md); 
      padding: var(--space-md) 0; 
      border-top: 1px solid var(--border-color); 
    }

    .character-role { 
      font-size: 0.875rem; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      font-weight: 700; 
      color: var(--accent-color); 
      margin-bottom: var(--space-xs); 
      display: block; 
    }

    .accordion { 
      background: var(--surface-color); 
      border: 1px solid var(--border-color); 
      border-radius: var(--radius-md); 
      overflow: hidden; 
      box-shadow: var(--shadow-sm); 
    }

    .accordion-item { 
      border-bottom: 1px solid var(--border-color); 
    }

    .accordion-item:last-child { 
      border-bottom: none; 
    }

    .accordion-trigger { 
      width: 100%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: var(--space-md); 
      text-align: left; 
      background: var(--surface-color); 
      transition: background-color 0.2s; 
    }

    .accordion-trigger:hover { 
      background-color: var(--bg-color); 
    }

    .accordion-icon { 
      width: 24px; 
      height: 24px; 
      position: relative; 
      color: var(--accent-color); 
    }

    .accordion-icon::before, 
    .accordion-icon::after { 
      content: ''; 
      position: absolute; 
      background-color: currentColor; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      transition: transform 0.3s ease; 
    }

    .accordion-icon::before { 
      width: 16px; 
      height: 2px; 
    }

    .accordion-icon::after { 
      width: 2px; 
      height: 16px; 
    }

    .accordion-item.is-open .accordion-icon::after { 
      transform: translate(-50%, -50%) rotate(90deg); 
    }

    .accordion-content-wrapper { 
      display: grid; 
      grid-template-rows: 0fr; 
      transition: grid-template-rows 0.3s ease-out; 
      background-color: var(--surface-color); 
    }

    .accordion-item.is-open .accordion-content-wrapper { 
      grid-template-rows: 1fr; 
    }

    .accordion-content { 
      overflow: hidden; 
    }

    .accordion-content p { 
      padding: 0 var(--space-md) var(--space-md) var(--space-md); 
      max-width: 80ch; 
    }

    .finale-layout { 
      grid-column: 2 / 12; 
      text-align: center; 
      padding: var(--space-lg); 
      background: var(--surface-color); 
      border: 1px solid var(--accent-light); 
      border-radius: var(--radius-md); 
      box-shadow: var(--shadow-sm); 
    }

    .finale-layout p { 
      margin-bottom: var(--space-sm); 
    }

    /* ==================================================
       6. Book Reader View Components
       ================================================== */
    .book-reader { 
      padding-top: calc(60px + var(--space-lg)); 
      padding-bottom: var(--space-xl); 
      background-color: #fdfdfc; 
    }

    .book-container { 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 0 var(--space-md); 
    }
    
    .back-btn { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      font-weight: 600; 
      color: var(--accent-color); 
      margin-bottom: var(--space-lg); 
      padding: 8px 16px; 
      border: 1px solid var(--accent-color); 
      border-radius: var(--radius-sm); 
      transition: all 0.2s; 
    }

    .back-btn:hover { 
      background-color: var(--accent-color); 
      color: #fff; 
    }
    
    .book-header { 
      text-align: center; 
      margin-bottom: var(--space-xl); 
      border-bottom: 2px solid var(--border-color); 
      padding-bottom: var(--space-lg); 
    }

    .book-header h1 { 
      font-family: var(--font-serif); 
      font-size: clamp(2.5rem, 5vw, 4rem); 
      color: var(--text-main); 
      margin-bottom: var(--space-sm); 
      line-height: 1.2; 
    }

    .book-author { 
      font-size: 1.2rem; 
      color: var(--text-muted); 
      font-style: italic; 
    }
    
    .book-section { 
      margin-bottom: var(--space-xl); 
    }

    .book-section h2 { 
      font-family: var(--font-primary); 
      font-size: 2rem; 
      color: var(--accent-color); 
      margin-bottom: var(--space-md); 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: var(--space-xs); 
    }
    
    .book-text { 
      font-family: var(--font-serif); 
      font-size: 1.15rem; 
      line-height: 1.8; 
      color: #2d3748; 
    }

    .book-text p { 
      margin-bottom: 1.5rem; 
      text-align: justify; 
    }
    
    .book-character { 
      margin-bottom: var(--space-md); 
      background: #f8fafc; 
      padding: var(--space-md); 
      border-radius: var(--radius-sm); 
      border-left: 4px solid var(--accent-color); 
    }

    .book-character h3 { 
      font-family: var(--font-primary); 
      font-size: 1.4rem; 
      margin-bottom: var(--space-xs); 
      color: var(--text-main); 
    }
    
    .book-chapter-title { 
      font-family: var(--font-primary); 
      font-size: 1.75rem; 
      font-weight: 900; 
      margin-top: var(--space-lg); 
      margin-bottom: var(--space-md); 
      color: var(--text-main); 
      text-align: center; 
    }

    /* ==================================================
       7. Responsive Styles
       ================================================== */
    @media (max-width: 1024px) {
      .hero-content { grid-column: 1 / 13; margin-bottom: var(--space-md); text-align: center; }
      .hero-visual { grid-column: 2 / 12; }
      .disaster-lead { grid-column: 1 / 13; }
      .disaster-stats { grid-column: 1 / 13; border-left: none; border-top: 2px solid var(--accent-light); padding-left: 0; padding-top: var(--space-md); }
    }

    @media (max-width: 768px) {
      .header-sub { justify-content: flex-start; }
      .character-item { grid-template-columns: 1fr; gap: var(--space-xs); }
      .finale-layout { grid-column: 1 / 13; text-align: left; padding: var(--space-md); }
      :root { --space-xl: 4rem; --space-lg: 2rem; }
      .book-text { font-size: 1.05rem; text-align: left; }
    }
  </style>
</head>

        <buttonПонял. В предыдущем варианте я сжал весь огромный текст в длинные сплошные строки внутри JavaScript (формат JSON), поэтому визуально количество строк кода сильно уменьшилось, хотя текста стало больше.

Чтобы файл стал **реально огромным** и физически занимал тысячи строк, как ты и просил, я:
1. Развернул весь CSS — теперь каждое свойство на отдельной строке.
2. Изменил структуру текста книги: теперь каждая глава — это не одна сплошная строка, а массив абзацев. Каждое предложение и абзац на всех трех языках (русский, английский, казахский) вынесены на новую строку. 
3. Значительно расширил сами главы, добавив больше художественного описания катастрофы.

Скопируй этот код. Из-за вертикального форматирования и огромного объема текста этот файл `index.html` теперь по-настоящему массивный.
